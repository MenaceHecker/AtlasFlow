name: ci

on:
  push:
    branches: ["dev", "main"]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ["api", "worker"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/pyproject.toml

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: ${{ matrix.service }}
        run: ruff check app/

      - name: Type check (mypy)
        working-directory: ${{ matrix.service }}
        run: mypy app/

      - name: Run tests with coverage
        working-directory: ${{ matrix.service }}
        run: python -m pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage.xml
          if-no-files-found: ignore

  integration-tests:
    name: Integration tests (LocalStack)
    # Run on main branch pushes only — keeps PR checks fast
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [python-tests]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install API + worker packages
        run: |
          python -m pip install -e "api/[dev]"
          python -m pip install -e "worker/[dev]"

      - name: Install integration test dependencies
        working-directory: tests
        run: python -m pip install -e ".[dev]"

      - name: Run integration tests
        working-directory: tests
        run: |
          python -m pytest integration/ -v --tb=short \
            --junitxml=integration-results.xml

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: tests/integration-results.xml
          if-no-files-found: ignore

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Terraform fmt
        run: terraform -chdir=infra fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=infra init -upgrade

      - name: Terraform validate
        run: terraform -chdir=infra validate
