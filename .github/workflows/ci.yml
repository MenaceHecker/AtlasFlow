name: ci

on:
  push:
    branches: ["dev", "main"]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ["api", "worker"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/pyproject.toml

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: ${{ matrix.service }}
        run: ruff check app/

      - name: Type check (mypy)
        working-directory: ${{ matrix.service }}
        run: mypy app/

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: python -m pytest

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Terraform fmt
        run: terraform -chdir=infra fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=infra init -upgrade

      - name: Terraform validate
        run: terraform -chdir=infra validate
