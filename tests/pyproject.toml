[project]
name = "atlasflow-integration-tests"
version = "0.1.0"
description = "AtlasFlow end-to-end integration tests via LocalStack + testcontainers"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.1",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "boto3>=1.34",
  "botocore>=1.34",
  "testcontainers[localstack]>=4.7",
  "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests/integration"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
