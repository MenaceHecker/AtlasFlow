[project]
name = "atlasflow-api"
version = "0.1.0"
description = "AtlasFlow FastAPI ingestion service LocalStack"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "boto3>=1.34",
  "botocore>=1.34",
  "prometheus-client>=0.20",
  "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1",
  "pytest-cov>=5.0",
  "moto[dynamodb,sqs,s3]>=5.0",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.10",
  "boto3-stubs[dynamodb,sqs]>=1.34",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
explicit_package_bases = true
exclude = ["tests/"]