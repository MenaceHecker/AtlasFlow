[project]
name = "atlasflow-worker"
version = "0.1.0"
description = "AtlasFlow SQS worker (LocalStack)"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34",
  "botocore>=1.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1",
  "pytest-cov>=5.0",
  "moto[dynamodb,sqs]>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"